<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Pothos · Daily page study</title>
<style>
:root{color-scheme:light;--ink:#292d32;--muted:#626b75;--host:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:16px;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0;background:var(--host);padding:24px 12px 32px}input,textarea{font:inherit}[hidden]{display:none!important}
.study{max-width:430px;margin:auto}.prototype-note{font-size:.75rem;line-height:1.5;color:var(--muted);margin:0 8px 14px}.page{position:relative;background:#fff;border:1px solid #d9dde1;border-radius:24px;overflow:hidden;padding:26px 22px 22px 32px}.page:before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:#d9a2ab;pointer-events:none}header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}h1{font-size:1rem;font-weight:500;letter-spacing:-.02em;margin:0}.year{font-size:.8125rem;color:var(--muted)}
.history{--cell:12px;--gap:4px;--label:2rem;margin-top:22px}.history-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}h2,.colour-label{font-size:.875rem;font-weight:500;margin:0}.range{font-size:.75rem;color:var(--muted)}.chart{width:100%}.seasons,.months{display:grid;grid-template-columns:repeat(var(--weeks),var(--cell));column-gap:var(--gap);margin-left:var(--label)}.seasons{height:23px;font-size:.75rem;color:var(--muted)}.season{border-bottom:1px solid var(--season-color);margin-right:6px;padding-bottom:4px}.months{height:24px;font-size:.75rem}.grid-row{display:flex;gap:4px}.weekdays{width:calc(var(--label) - 4px);flex-shrink:0;display:grid;grid-template-rows:repeat(7,var(--cell));row-gap:var(--gap);font-size:.75rem;color:var(--muted);line-height:var(--cell)}.weekdays span:nth-child(1){grid-row:2}.weekdays span:nth-child(2){grid-row:4}.weekdays span:nth-child(3){grid-row:6}.grid{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:var(--gap)}.cell{width:var(--cell);height:var(--cell);border-radius:2px;background:#ebedf0}.cell[data-state=future]{background:#f4f6f8}.cell[data-state=outside]{background:transparent}.cell[data-today]{outline:1px solid #555f69;outline-offset:1px}
blockquote{font-family:Baskerville,"Times New Roman",serif;font-size:1.25rem;line-height:1.45;font-style:italic;font-weight:400;margin:28px 0 22px;max-width:285px;color:#464b50}.colour-label{display:block}.slider-wrap{position:relative;margin-top:8px;height:44px}.shade-track{position:absolute;left:12px;right:12px;top:13px;height:18px;border-radius:9px;background:linear-gradient(to right,rgb(233,154,125),rgb(181,138,161));pointer-events:none}input[type=range]{appearance:none;-webkit-appearance:none;position:relative;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y;border-radius:6px}input[type=range]::-webkit-slider-runnable-track{height:24px;background:transparent}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:3px solid #fff;border-radius:50%;background:var(--chosen,#fff);box-shadow:0 0 0 1px #555f69}input[type=range]::-moz-range-track{height:24px;background:transparent}input[type=range]::-moz-range-thumb{box-sizing:border-box;width:24px;height:24px;border:3px solid #fff;border-radius:50%;background:var(--chosen,#fff);box-shadow:0 0 0 1px #555f69}input:focus-visible,textarea:focus-visible{outline:2px solid #555f69;outline-offset:3px}.slider-hint{font-size:.8125rem;color:var(--muted);margin:2px 0 0;line-height:1.5}
textarea{display:block;resize:none;overflow:hidden;width:100%;min-height:76px;border:0;border-radius:3px;background:transparent;margin-top:18px;padding:8px 0;line-height:1.65;font-size:1rem;color:var(--ink)}textarea::placeholder{color:#69737e;opacity:1}.status{min-height:20px;font-size:.8125rem;color:var(--muted);margin:8px 0 0;line-height:1.5}
@media(prefers-color-scheme:dark){:root{--host:#20252b}.prototype-note{color:#c5cbd2}}
@media(max-width:350px){body{padding:16px 8px 24px}.page{padding:24px 15px 20px 26px;border-radius:20px}.page:before{left:13px}.year{font-size:.75rem}blockquote{margin:24px 0 18px}.history{margin-top:20px}}
</style>
</head>
<body><div class="study"><p class="prototype-note">Daily page study · Sample entries<br>Changes reset when this page is reloaded.</p><main class="page">
<header><h1>Saturday, 19 September</h1><span class="year">2026</span></header>
<section class="history" aria-labelledby="history-heading"><div class="history-heading"><h2 id="history-heading">Recent pages</h2><span class="range">Jul–Sep</span></div><div class="chart" role="img" aria-label="Daily diary history from July to September 2026. Saved days use their selected colours. September 19 has no entry yet."><div class="seasons" aria-hidden="true"></div><div class="months" aria-hidden="true"></div><div class="grid-row" aria-hidden="true"><div class="weekdays"><span>Mon</span><span>Wed</span><span>Fri</span></div><div class="grid"></div></div></div></section>
<blockquote>The light changes before we notice.</blockquote>
<section aria-labelledby="colour-heading"><label id="colour-heading" class="colour-label" for="shade">Today’s colour</label><div class="slider-wrap"><div class="shade-track" aria-hidden="true"></div><input id="shade" type="range" min="0" max="100" value="50" aria-describedby="shade-hint" aria-valuetext="No shade selected"></div><p id="shade-hint" class="slider-hint">Slide to choose a shade.</p></section>
<textarea aria-label="Optional note" placeholder="A thought, a fragment, a detail…" rows="2"></textarea><p class="status" role="status" aria-live="polite"></p>
</main></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), today='2026-09-19', day=86400000, start=Date.UTC(2026,5,28),end=Date.UTC(2026,9,3),weeks=14;
const palettes=[[232,168,182],[196,217,154],[242,213,138],[185,220,236],[233,154,125],[181,138,161]];
let choice=null,timer;const saved=new Map();
const history=$('.history'),grid=$('.grid'),chart=$('.chart'),status=$('.status'),slider=$('#shade');
function color(x){return palettes[4].map((a,i)=>Math.round(a+(palettes[5][i]-a)*x));}
function rgb(c){return `rgb(${c.join(', ')})`;}
history.style.setProperty('--weeks',weeks);
function label(parent,text,col,span,seasonColor){const s=document.createElement('span');s.textContent=text;s.style.gridColumn=`${col+1} / span ${span}`;if(seasonColor){s.className='season';s.style.setProperty('--season-color',seasonColor);}$(parent).append(s);}
const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];for(let m=6;m<=8;m++){const col=Math.floor((Date.UTC(2026,m,1)-start)/day/7);const next=Math.min(weeks,Math.floor((Date.UTC(2026,m+1,1)-start)/day/7));label('.months',names[m],col,next-col);}
label('.seasons','Summer',0,9,'#b9dcec');label('.seasons','Autumn',9,5,'#b58aa1');
const fixture=new URLSearchParams(location.search).get('history');
for(let t=start;t<=end;t+=day){const d=new Date(t),iso=d.toISOString().slice(0,10),m=d.getUTCMonth(),n=d.getUTCDate(),cell=document.createElement('span');cell.className='cell';cell.dataset.date=iso;cell.dataset.state=(m<6||m>8)?'outside':iso>today?'future':'empty';if(iso===today)cell.dataset.today='true';if(m>=6&&m<=8&&iso<today&&fixture!=='empty'&&(fixture!=='sparse'||n%9===0)){const p=m<5?0:m<8?2:4,seed=n*13+m*17,x=(seed%23)/22,depth=.92+((seed*7)%15)/100;const c=palettes[p].map((v,i)=>Math.round(Math.min(255,(v+(palettes[p+1][i]-v)*x)*depth)));cell.style.background=rgb(c);cell.dataset.state='recorded';saved.set(iso,rgb(c));}grid.append(cell);}
function fit(){const available=$('.chart').clientWidth-($('.weekdays').getBoundingClientRect().width+4);const gap=available<270?3:4;history.style.setProperty('--gap',gap+'px');history.style.setProperty('--cell',((available-gap*(weeks-1))/weeks)+'px');}new ResizeObserver(fit).observe(history);fit();
function schedule(){clearTimeout(timer);if(choice===null){status.textContent=$('textarea').value?'Draft · Choose a colour to save':'';return;}status.textContent='Saving…';timer=setTimeout(()=>{const cell=$(`[data-date="${today}"]`);const c=rgb(color(choice));cell.style.background=c;cell.dataset.state='recorded';saved.set(today,c);status.textContent='Saved';chart.setAttribute('aria-label','Daily diary history from July to September 2026. Saved days use their selected colours. September 19 has a saved entry.');},650);}
function select(){choice=Number(slider.value)/100;const c=color(choice);slider.style.setProperty('--chosen',rgb(c));slider.setAttribute('aria-valuetext',`Shade ${slider.value} of 100, RGB ${c.join(', ')}`);schedule();}
slider.addEventListener('input',select);
// A deliberate click on the initial midpoint also chooses that shade.
slider.addEventListener('pointerup',()=>{if(choice===null)select();});
slider.addEventListener('keydown',e=>{if(['Home','End','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))requestAnimationFrame(()=>{if(choice===null)select();});});
const note=$('textarea');function grow(){note.style.height='auto';note.style.height=note.scrollHeight+'px';}note.addEventListener('input',()=>{grow();schedule();});new ResizeObserver(()=>{if(note.clientWidth!==note._width){note._width=note.clientWidth;grow();}}).observe(note);

})();
</script></body></html>
