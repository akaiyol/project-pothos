<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Pothos · Daily page study</title>
<style>
:root{color-scheme:light;--ink:#24292f;--muted:#616b76;--border:#d0d7de;--host:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:16px;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0;background:var(--host);padding:24px 12px 32px}button,input,textarea,summary{font:inherit}button,summary{touch-action:manipulation}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #454f5a;outline-offset:4px}[hidden]{display:none!important}
.study{max-width:430px;margin:auto}.prototype-note{font-size:.75rem;line-height:1.5;color:var(--muted);margin:0 8px 14px}.page{position:relative;background:#fff;border:1px solid var(--border);border-radius:24px;overflow:hidden;padding:28px 20px 28px 32px}.page:before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:#d9a2ab;pointer-events:none}header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}h1{font-size:1rem;font-weight:500;letter-spacing:-.02em;margin:0}.year{font-size:.8125rem;color:var(--muted)}blockquote{font-family:Baskerville,"Times New Roman",serif;font-size:1.375rem;line-height:1.45;font-style:italic;font-weight:400;margin:28px 0 30px;max-width:285px;color:#464b50}h2{font-size:.9375rem;font-weight:500;letter-spacing:-.01em;margin:0}.field-heading{margin-bottom:12px}.field{position:relative;width:100%;aspect-ratio:3.25;border-radius:12px;overflow:hidden;touch-action:none;cursor:crosshair;outline-offset:4px}.field canvas{display:block;width:100%;height:100%}.marker{position:absolute;width:18px;height:18px;border:2px solid white;box-shadow:0 0 0 1.5px #343a40;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.adjust{margin-top:4px}summary{font-size:.875rem;color:var(--muted);cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:flex-end;gap:8px;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:18px}details[open] summary:after{content:'−'}.ranges{padding:4px 0 12px}.range-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;font-size:.875rem;color:var(--muted)}input[type=range]{width:100%;height:44px;accent-color:#996e7c;margin:0}textarea{display:block;resize:vertical;width:100%;min-height:112px;border:0;border-radius:4px;background:transparent;padding:12px 0;line-height:1.65;font-size:1rem;color:var(--ink)}textarea::placeholder{color:#69737e;opacity:1}.status{min-height:24px;font-size:.8125rem;color:var(--muted);text-align:right;margin:4px 0 28px;line-height:1.5}.history{--cell:7px;--gap:2px;--label:2rem}.history-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:23px}.range{font-size:.75rem;color:var(--muted);white-space:nowrap}.chart{width:100%}.seasons,.months{display:grid;grid-template-columns:repeat(var(--weeks),var(--cell));column-gap:var(--gap);margin-left:var(--label)}.seasons{height:23px;font-size:.6875rem;color:var(--muted);letter-spacing:.04em}.season{border-bottom:1px solid var(--season-color);margin-right:6px;padding-bottom:4px}.months{height:27px;font-size:.75rem}.grid-row{display:flex;gap:4px}.weekdays{width:calc(var(--label) - 4px);flex-shrink:0;display:grid;grid-template-rows:repeat(7,var(--cell));row-gap:var(--gap);font-size:.6875rem;color:var(--muted);line-height:var(--cell)}.weekdays span:nth-child(1){grid-row:2}.weekdays span:nth-child(2){grid-row:4}.weekdays span:nth-child(3){grid-row:6}.grid{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:var(--gap)}.cell{width:var(--cell);height:var(--cell);border-radius:2px;background:#ebedf0}.cell[data-state=future]{background:#f4f6f8}.cell[data-state=outside]{background:transparent}.cell[data-today]{outline:1px solid #454f5a;outline-offset:1px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(prefers-color-scheme:dark){:root{--host:#20252b}.prototype-note{color:#c5cbd2}}
@media(max-width:350px){body{padding:16px 8px 24px}.page{padding:24px 14px 26px 26px;border-radius:20px}.page:before{left:13px}blockquote{font-size:1.25rem;margin:25px 0}.history-heading{gap:6px}.history{--label:2rem}.year{font-size:.75rem}}
</style>
</head>
<body><div class="study"><p class="prototype-note">Daily page study · Sample entries<br>Changes reset when this page is reloaded.</p><main class="page">
<header><h1>Saturday, 19 September</h1><span class="year">2026</span></header>
<blockquote>The light changes before we notice.</blockquote>
<section aria-labelledby="colour-heading"><h2 id="colour-heading" class="field-heading">Today’s colour</h2><div class="field" role="group" aria-label="Two-dimensional colour field. Tap to choose, or use Adjust colour below."><canvas aria-hidden="true" width="650" height="200"></canvas><span class="marker" hidden></span></div>
<details class="adjust"><summary>Adjust colour</summary><div class="ranges"><label class="range-row">Horizontal<input id="horizontal" type="range" min="0" max="100" value="50" aria-label="Horizontal colour position"></label><label class="range-row">Vertical<input id="vertical" type="range" min="0" max="100" value="50" aria-label="Vertical colour position"></label></div></details></section>
<textarea aria-label="Optional note" placeholder="A thought, a fragment, a detail…" rows="3"></textarea><p class="status" role="status" aria-live="polite"></p>
<section class="history" aria-labelledby="history-heading"><div class="history-heading"><h2 id="history-heading">Recent pages</h2><span class="range">Apr–Oct</span></div><div class="chart" role="img" aria-label="Daily diary history from April to October 2026. Saved days use their selected colours. September 19 has no entry yet."><div class="seasons" aria-hidden="true"></div><div class="months" aria-hidden="true"></div><div class="grid-row" aria-hidden="true"><div class="weekdays"><span>Mon</span><span>Wed</span><span>Fri</span></div><div class="grid"></div></div></div></section>
</main></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), today='2026-09-19', day=86400000, start=Date.UTC(2026,2,29),end=Date.UTC(2026,9,31),weeks=31;
const palettes=[[232,168,182],[196,217,154],[242,213,138],[185,220,236],[233,154,125],[181,138,161]];
let choice=null,timer;const saved=new Map();
const history=$('.history'),grid=$('.grid'),chart=$('.chart'),status=$('.status'),field=$('.field'),marker=$('.marker'),canvas=$('canvas'),ctx=canvas.getContext('2d');
function color(x,y){const base=palettes[4].map((a,i)=>a+(palettes[5][i]-a)*x);return base.map(a=>Math.round(y<.5?a+(255-a)*(.5-y)*1.05:a*(1-(y-.5)*.55)));}
function rgb(c){return `rgb(${c.join(', ')})`;}
const pixels=ctx.createImageData(650,200);for(let y=0;y<200;y++)for(let x=0;x<650;x++){let i=(y*650+x)*4;pixels.data.set([...color(x/649,y/199),255],i);}ctx.putImageData(pixels,0,0);
history.style.setProperty('--weeks',weeks);
function label(parent,text,col,span,seasonColor){const s=document.createElement('span');s.textContent=text;s.style.gridColumn=`${col+1} / span ${span}`;if(seasonColor){s.className='season';s.style.setProperty('--season-color',seasonColor);}$(parent).append(s);}
const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];for(let m=3;m<=9;m++){const col=Math.floor((Date.UTC(2026,m,1)-start)/day/7);const next=Math.min(weeks,Math.floor((Date.UTC(2026,m+1,1)-start)/day/7));label('.months',names[m],col,next-col);}
label('.seasons','Spring',0,9,'#c4d99a');label('.seasons','Summer',9,13,'#b9dcec');label('.seasons','Autumn',22,9,'#b58aa1');
const fixture=new URLSearchParams(location.search).get('history');
for(let t=start;t<=end;t+=day){const d=new Date(t),iso=d.toISOString().slice(0,10),m=d.getUTCMonth(),n=d.getUTCDate(),cell=document.createElement('span');cell.className='cell';cell.dataset.date=iso;cell.dataset.state=m<3?'outside':iso>today?'future':'empty';if(iso===today)cell.dataset.today='true';if(m>=3&&iso<today&&fixture!=='empty'&&(fixture!=='sparse'||n%9===0)){const p=m<5?0:m<8?2:4,seed=n*13+m*17,x=(seed%23)/22,depth=.92+((seed*7)%15)/100;const c=palettes[p].map((v,i)=>Math.round(Math.min(255,(v+(palettes[p+1][i]-v)*x)*depth)));cell.style.background=rgb(c);cell.dataset.state='recorded';saved.set(iso,rgb(c));}grid.append(cell);}
function fit(){const available=$('.chart').clientWidth-($('.weekdays').getBoundingClientRect().width+4);const gap=available<270?2:3;history.style.setProperty('--gap',gap+'px');history.style.setProperty('--cell',((available-gap*(weeks-1))/weeks)+'px');}new ResizeObserver(fit).observe(history);fit();
function schedule(){clearTimeout(timer);if(!choice){status.textContent=$('textarea').value?'Draft · Choose a colour to save':'';return;}status.textContent='Saving…';timer=setTimeout(()=>{const cell=$(`[data-date="${today}"]`);const c=rgb(color(choice.x,choice.y));cell.style.background=c;cell.dataset.state='recorded';saved.set(today,c);status.textContent='Saved';chart.setAttribute('aria-label','Daily diary history from April to October 2026. Saved days use their selected colours. September 19 has a saved entry.');},650);}
function select(x,y){choice={x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))};marker.hidden=false;marker.style.left=`calc(12px + (100% - 24px) * ${choice.x})`;marker.style.top=`calc(12px + (100% - 24px) * ${choice.y})`;$('#horizontal').value=Math.round(choice.x*100);$('#vertical').value=Math.round(choice.y*100);schedule();}
function point(e){const r=field.getBoundingClientRect();select((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);}field.addEventListener('pointerdown',e=>{field.setPointerCapture(e.pointerId);point(e);});field.addEventListener('pointermove',e=>{if(field.hasPointerCapture(e.pointerId))point(e);});for(const id of ['horizontal','vertical'])$('#'+id).addEventListener('input',()=>select(+$('#horizontal').value/100,+$('#vertical').value/100));$('textarea').addEventListener('input',schedule);
})();
</script></body></html>
